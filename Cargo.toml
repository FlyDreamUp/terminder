[workspace]
members = ["crates/session-core", "apps/desktop/src-tauri"]
default-members = ["crates/session-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
uuid = { version = "1.18", features = ["v4", "serde"] }
tracing = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
