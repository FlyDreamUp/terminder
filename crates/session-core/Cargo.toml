[package]
name = "terminder-session-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows-version = "=0.1.7"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_System_Console", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_System_Environment"] }

[dev-dependencies]
tempfile = "3.23"

[features]
test-fixture = []

[[bin]]
name = "pty-fixture"
path = "../../tests/fixtures/pty_fixture.rs"
required-features = ["test-fixture"]

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Diagnostics_ProcessSnapshotting"] }
