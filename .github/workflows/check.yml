name: Verify Terminder
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.91.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: rustup toolchain install 1.91.0 --profile minimal --component rustfmt --component clippy
      - run: npm --prefix apps/desktop ci
      - run: npm --prefix apps/desktop run typecheck
      - run: npm --prefix apps/desktop run lint
      - run: npm --prefix apps/desktop run test
      - run: npm --prefix apps/desktop run test:e2e
      - run: npm --prefix apps/desktop run build
      - run: npm --prefix apps/desktop run test:notices
      - run: npm --prefix apps/desktop run notices
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --features terminder-session-core/test-fixture --locked -- -D warnings
      - run: cargo test -p terminder-session-core --test windows_default_build --locked
      - run: cargo test --workspace --features terminder-session-core/test-fixture --locked -- --test-threads=1
      - run: cargo build -p terminder-desktop --release --features test-support,tauri/custom-protocol --locked
      - run: npm --prefix apps/desktop run test:native
      - run: npm --prefix apps/desktop run tauri -- build
      - run: git diff --exit-code -- Cargo.lock apps/desktop/package-lock.json
      - name: Collect checksums
        shell: pwsh
        run: Get-ChildItem target/release/bundle/nsis/*.exe | Get-FileHash -Algorithm SHA256 | Format-List | Out-File target/release/bundle/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-verification
          path: |
            apps/desktop/test-results/
            target/release/bundle/
            target/native-smoke/*/report.json
            target/native-smoke/*/*.png
            target/release-notices/
