name: Verify Terminder
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.91.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked --no-fail-fast
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.91.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --features terminder-desktop/test-support --locked -- -D warnings
      - run: cargo test -p terminder-session-core --test windows_default_build --locked
      - run: cargo test --workspace --features terminder-desktop/test-support --locked --no-fail-fast -- --test-threads=1
      - run: cargo build --workspace --features terminder-desktop/test-support --locked
      - name: Native ConPTY and GPUI window checks
        shell: pwsh
        run: |
          $fixture = (Resolve-Path target/debug/pty-fixture.exe).Path
          & target/debug/terminder-desktop.exe --smoke $fixture "$PWD/target/native-gpui/conpty-report.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & target/debug/terminder-desktop.exe --ui-smoke $fixture "$PWD/target/native-gpui/ui-report.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & target/debug/terminder-desktop.exe --restore-smoke "$PWD/target/native-gpui/ui-report.json" "$PWD/target/native-gpui/restore-report.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run: ./scripts/package.ps1
      - run: git diff --exit-code -- Cargo.lock
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-native-verification
          path: |
            target/package/*.zip
            target/package/*.sha256
            target/native-gpui/*report.json
            target/release-notices/
