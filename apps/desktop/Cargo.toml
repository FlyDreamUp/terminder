[package]
name = "terminder-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
default-run = "terminder-desktop"

[dependencies]
terminder-session-core = { path = "../../crates/session-core" }
alacritty_terminal = "=0.25.1"
anyhow = "1"
async-channel = "2"
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tracing.workspace = true
tracing-subscriber = "0.3"
toml = "0.9"
toml_edit = "0.23"
sha2 = "0.10"
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
directories = "6.0"
raw-window-handle = "=0.6.2"
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3.23"

[features]
test-support = ["terminder-session-core/test-fixture", "windows-sys/Win32_Graphics_Gdi"]
